name: Build Pterodactyl + Blueprint

on:
  workflow_dispatch:
    inputs:
      panel_version:
        description: "Pterodactyl release tag, or 'latest'"
        required: true
        default: "latest"
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches:
      - main
    paths:
      - "extensions/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip rsync

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, curl, zip, gd, mysql
          tools: composer:v2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Yarn 1
        run: npm install -g yarn@1.22.22

      - name: Download Pterodactyl Panel
        env:
          PANEL_VERSION: ${{ inputs.panel_version || 'latest' }}
        run: |
          mkdir panel
          if [ "$PANEL_VERSION" = "latest" ]; then
            URL="https://github.com/pterodactyl/panel/releases/latest/download/panel.tar.gz"
          else
            URL="https://github.com/pterodactyl/panel/releases/download/${PANEL_VERSION}/panel.tar.gz"
          fi
          curl -fL --retry 3 "$URL" -o panel.tar.gz
          tar -xzf panel.tar.gz -C panel

      - name: Download Blueprint
        working-directory: panel
        run: |
          curl -fL --retry 3 "https://github.com/BlueprintFramework/framework/releases/latest/download/release.zip" -o release.zip
          unzip -oq release.zip
          rm -f release.zip
          test -f blueprint.sh
          chmod +x blueprint.sh

      - name: Install PHP production dependencies
        working-directory: panel
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install Node dependencies
        working-directory: panel
        run: yarn install --frozen-lockfile || yarn install

      - name: Install Blueprint extensions
        working-directory: panel
        env:
          IgnoreRebuild: "true"
          NEBULA_BLUEPRINT_URL: ${{ secrets.NEBULA_BLUEPRINT_URL }}
        run: |
          # Blueprint's installer places a `blueprint` shortcut in /usr/local/bin
          # and runs extension install hooks via `su $WEBUSER`. Neither works
          # as the runner user, so neutralize the shortcut and point the hook
          # user at the runner account. The installer itself runs under sudo
          # so `su` succeeds; ownership is restored afterwards.
          printf 'SHORTCUT_DIR=""\nWEBUSER="runner"\n' > .blueprintrc

          cp "$GITHUB_WORKSPACE/extensions/"*.blueprint . 2>/dev/null || true

          # Nebula is paid software whose EULA forbids redistribution, so it
          # is never committed to this repository. If a private download URL
          # is configured, fetch it for this build only.
          if [ -n "${NEBULA_BLUEPRINT_URL:-}" ]; then
            curl -fL --retry 3 "$NEBULA_BLUEPRINT_URL" -o nebula.blueprint
          fi

          names=""
          for f in *.blueprint; do
            [ -f "$f" ] || continue
            names="$names ${f%.blueprint}"
          done

          if [ -z "$names" ]; then
            echo "No .blueprint files found, skipping extension install."
            : > "$GITHUB_WORKSPACE/installed_extensions.txt"
            exit 0
          fi

          # stdin is /dev/null so interactive install hooks (Nebula asks the
          # user to press RETURN twice) continue instead of hanging.
          sudo bash blueprint.sh -bash -install $names < /dev/null

          # The installer's finalize step chowns the panel to www-data.
          # Restore runner ownership (node_modules is excluded: it is big
          # and the installer never touches it).
          sudo find . -path ./node_modules -prune -o -exec chown "$(id -u):$(id -g)" {} +

          # The installer exits 0 when at least one extension succeeds, so a
          # single failed extension would otherwise go unnoticed.
          installed="$(grep -o '|[^,]*,' .blueprint/extensions/blueprint/private/db/installed_extensions 2>/dev/null | tr -d '|,' | tr '\n' ' ' || true)"
          missing=""
          for id in $names; do
            case " $installed " in
              *" $id "*) ;;
              *) missing="$missing $id" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "ERROR: extensions failed to install:$missing"
            exit 1
          fi
          printf '%s\n' $installed > "$GITHUB_WORKSPACE/installed_extensions.txt"
          echo "Installed extensions:$installed"

      - name: Build production assets
        working-directory: panel
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: yarn run build:production --progress

      - name: Prepare deployable package
        working-directory: panel
        run: |
          # Blueprint's upstream release may unpack into blueprint/. The panel
          # runtime expects .blueprint/. Normalize before creating the artifact.
          if [ -d blueprint ] && [ ! -d .blueprint ]; then
            mv blueprint .blueprint
          fi
          test -f .blueprint/extensions/blueprint/private/extensionfs.php

          rm -rf node_modules .git .update
          rm -rf .blueprint/tmp/*
          rm -rf storage/logs/* storage/framework/cache/* storage/framework/sessions/* storage/framework/views/*
          rm -f .env
          rm -f *.blueprint .blueprintrc
          find bootstrap/cache -type f ! -name '.gitignore' -delete || true
          find . -type f -name '*.map' -delete

          # Explicitly archive .blueprint with its leading dot preserved.
          tar -czf ../pterodactyl-blueprint-build.tar.gz .

      - name: Verify deploy package
        run: |
          tar -tzf pterodactyl-blueprint-build.tar.gz > package_contents.txt
          grep -qx './.blueprint/extensions/blueprint/private/extensionfs.php' package_contents.txt
          ! grep -q '^./blueprint/extensions/blueprint/private/extensionfs.php$' package_contents.txt
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            if ! grep -qx "./.blueprint/extensions/$id/private/.store/conf.yml" package_contents.txt; then
              echo "ERROR: extension '$id' is missing from the deploy package."
              exit 1
            fi
          done < installed_extensions.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pterodactyl-blueprint-build
          path: pterodactyl-blueprint-build.tar.gz
          retention-days: 14

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" pterodactyl-blueprint-build.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pterodactyl + Blueprint build $TAG" \
            --notes "Automated deploy package built by GitHub Actions." \
            --latest
