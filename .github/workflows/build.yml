name: Build Pterodactyl + Blueprint

on:
  workflow_dispatch:
    inputs:
      panel_version:
        description: "Pterodactyl release tag, or 'latest'"
        required: true
        default: "latest"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip rsync

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, curl, zip, gd, mysql
          tools: composer:v2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Yarn 1
        run: npm install -g yarn@1.22.22

      - name: Download Pterodactyl Panel
        env:
          PANEL_VERSION: ${{ inputs.panel_version || 'latest' }}
        run: |
          mkdir panel
          if [ "$PANEL_VERSION" = "latest" ]; then
            URL="https://github.com/pterodactyl/panel/releases/latest/download/panel.tar.gz"
          else
            URL="https://github.com/pterodactyl/panel/releases/download/${PANEL_VERSION}/panel.tar.gz"
          fi
          curl -fL --retry 3 "$URL" -o panel.tar.gz
          tar -xzf panel.tar.gz -C panel

      - name: Download Blueprint
        working-directory: panel
        run: |
          curl -fL --retry 3 "https://github.com/BlueprintFramework/framework/releases/latest/download/release.zip" -o release.zip
          unzip -oq release.zip
          rm -f release.zip
          test -f blueprint.sh
          chmod +x blueprint.sh

      - name: Install PHP production dependencies
        working-directory: panel
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install Node dependencies
        working-directory: panel
        run: yarn install --frozen-lockfile || yarn install

      - name: Build production assets
        working-directory: panel
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: yarn run build:production --progress

      - name: Prepare deployable package
        working-directory: panel
        run: |
          # Blueprint's upstream release may unpack into blueprint/. The panel
          # runtime expects .blueprint/. Normalize before creating the artifact.
          if [ -d blueprint ] && [ ! -d .blueprint ]; then
            mv blueprint .blueprint
          fi
          test -f .blueprint/extensions/blueprint/private/extensionfs.php

          rm -rf node_modules .git .update
          rm -rf .blueprint/tmp/*
          rm -rf storage/logs/* storage/framework/cache/* storage/framework/sessions/* storage/framework/views/*
          rm -f .env
          find bootstrap/cache -type f ! -name '.gitignore' -delete || true
          find . -type f -name '*.map' -delete

          # Explicitly archive .blueprint with its leading dot preserved.
          tar -czf ../pterodactyl-blueprint-build.tar.gz .

      - name: Verify deploy package
        run: |
          tar -tzf pterodactyl-blueprint-build.tar.gz | grep -qx './.blueprint/extensions/blueprint/private/extensionfs.php'
          ! tar -tzf pterodactyl-blueprint-build.tar.gz | grep -q '^./blueprint/extensions/blueprint/private/extensionfs.php$'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pterodactyl-blueprint-build
          path: pterodactyl-blueprint-build.tar.gz
          retention-days: 14

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" pterodactyl-blueprint-build.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pterodactyl + Blueprint build $TAG" \
            --notes "Automated deploy package built by GitHub Actions." \
            --latest
